# BI-слой Capibara: Apache Superset поверх схемы core в PostgreSQL организаторов.
# Свою базу Superset не создаёт: к marketplace он ходит через host.docker.internal,
# поэтому от имени docker-сети и compose-проекта организаторов не зависит.
name: capibara-bi
services:
  superset:
    build: .
    image: capibara-superset:6.1.0
    container_name: capibara_superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Запустите dashboard/up.sh или скопируйте .env.example в .env}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:8088:8088"      # только локально
    volumes:
      - ./superset_config.py:/app/superset_config.py:ro
      - ./bootstrap.sh:/app/bootstrap.sh:ro
      - superset_home:/app/superset_home
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/bin/sh", "/app/bootstrap.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
volumes:
  superset_home:
